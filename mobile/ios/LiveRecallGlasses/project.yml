# XcodeGen project manifest for LiveRecallGlasses (iOS).
#
# Why XcodeGen instead of a checked-in .xcodeproj:
#   - .pbxproj is a binary-ish format that conflicts horribly in git.
#   - This file (~30 lines) regenerates the whole Xcode project deterministically.
#
# To generate the project:
#   brew install xcodegen
#   cd LiveRecall/mobile/ios/LiveRecallGlasses
#   xcodegen generate
#   open LiveRecallGlasses.xcodeproj
#
# If you don't want to install XcodeGen, see ../../README.md for the manual
# "create a new SwiftUI iOS app and drag in these files" path.

name: LiveRecallGlasses
options:
  bundleIdPrefix: com.liverecall
  deploymentTarget:
    iOS: "15.2"
  createIntermediateGroups: true

# ---------------------------------------------------------------------------
# Swift Package dependencies.
#
# Both packages are public on GitHub:
#   - LiveKit's Swift client SDK is the WebRTC publisher we use to push the
#     glasses POV video + phone mic into the LiveRecall LiveKit room.
#   - meta-wearables-dat-ios is Meta's open-source Wearables Device Access
#     Toolkit — DAT for short. The package itself pulls without credentials;
#     what does need credentials are the per-developer MetaAppID and
#     ClientToken in Info.plist (grab those from the Wearables Dev Center at
#     https://wearables.developer.meta.com/). MWDATCore + MWDATCamera are
#     the two products we need: Core for registration / sessions, Camera for
#     the video stream + still-photo capture used by the Snap & ask path.
# ---------------------------------------------------------------------------
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: "2.0.0"
  WearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    from: "0.6.0"

targets:
  LiveRecallGlasses:
    type: application
    platform: iOS
    sources:
      - path: LiveRecallGlasses
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liverecall.glasses
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: LiveRecallGlasses/Resources/Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: "A65HN768M8"
    dependencies:
      - package: LiveKit
        product: LiveKit
      - package: WearablesDAT
        product: MWDATCore
      - package: WearablesDAT
        product: MWDATCamera
